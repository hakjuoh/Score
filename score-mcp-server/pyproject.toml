[project]
name = "score-mcp-server"
version = "0.1.1"
description = "A Model Context Protocol (MCP) server that provides programmatic access to Score (connectCenter) - a platform for managing business information standards, Core Components, Business Information Entities (BIEs), and related metadata"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.14.5",
    "aiohttp>=3.13.3",
    "sqlmodel>=0.0.33",
    "mariadb>=1.1.14",
    "bcrypt>=4.0.0",
    "pydantic-settings>=2.12.0",
    "fastapi>=0.129.0",
    "python-dotenv>=1.2.1",
    "redis>=7.1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "uvicorn[standard]>=0.40.0",
    "sse-starlette[uvicorn]>=3.2.0",
]
