spring:
  devtools:
    # spring.devtools.livereload.* was removed in Spring Boot 4 (LiveReload dropped, no replacement) (#1750).
    restart:
      enabled: true
      additional-paths:
        - src/main/java
        - src/main/resources
      poll-interval: 2s
      quiet-period: 1s
  ai:
    mcp:
      client:
        streamable-http:
          connections:
            connect-center-mcp:
              url: ${CONNECT_CENTER_MCP_URL:http://127.0.0.1:5555}
              auth:
                issuer-url: ${CONNECT_CENTER_MCP_ISSUER_URL:http://127.0.0.1:9000/broker}

logging:
  level:
    org.springframework.boot.devtools: INFO
    org.springframework: INFO
    org.springframework.security: DEBUG
    org.springframework.websocket: DEBUG
    org.springframework.messaging: DEBUG
    org.jooq: DEBUG
    org.oagi.score: DEBUG

management:
  tracing:
    export:
      enabled: ${OTEL_TRACES_EXPORT_ENABLED:true}
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:true}
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${OTEL_DEPLOYMENT_ENVIRONMENT:development}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:true}

score:
  ai:
    catalog:
      bootstrap-enabled: ${SCORE_AI_CATALOG_BOOTSTRAP_ENABLED:true}
    observability:
      enabled: ${SCORE_AI_OBSERVABILITY_ENABLED:true}
