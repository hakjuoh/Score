server:
  port: 9000
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

spring:
  aop:
    proxy-target-class: true

  # Spring Boot 4 defaults to Jackson 3. Align the auto-configured mapper with Jackson 2
  # defaults during the migration (#1750); paired with the spring-boot-jackson2 bridge.
  jackson:
    use-jackson2-defaults: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:oagi}?useSSL=false&allowMultiQueries=true
    username: ${DB_USERNAME:oagi}
    password: ${DB_PASSWORD:oagi}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:3.4.0}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}

  jooq:
    sql-dialect: mariadb

  session:
    store-type: redis

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      sentinel:
        master: ${REDIS_SENTINEL_MASTER}
        nodes: ${REDIS_SENTINEL_NODES:}
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}

  main:
    allow-circular-references: true

  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        timeout: ${OLLAMA_TIMEOUT:20s}
    mcp:
      client:
        # ConnectCenterMcpClientFactory creates a requester-scoped client per chat turn.
        request-timeout: ${SCORE_AI_MCP_REQUEST_TIMEOUT:60s}
        initialization-timeout: ${SCORE_AI_MCP_INITIALIZATION_TIMEOUT:20s}
        # Status probes must fail quickly and never inherit the long chat/elicitation timeout.
        status-timeout: ${SCORE_AI_MCP_STATUS_TIMEOUT:5s}
        streamable-http:
          connections:
            connect-center-mcp:
              url: ${CONNECT_CENTER_MCP_URL:}
              endpoint: ${CONNECT_CENTER_MCP_ENDPOINT:/mcp/}
              auth:
                bearer-token: ${CONNECT_CENTER_MCP_BEARER_TOKEN:}
                issuer-url: ${CONNECT_CENTER_MCP_ISSUER_URL:}
                audience: ${CONNECT_CENTER_MCP_AUDIENCE:connect-center-mcp}
                algorithm: ${CONNECT_CENTER_MCP_JWT_ALGORITHM:ES256}
                # Raised to at least the elicitation timeout plus 60 seconds at runtime.
                token-ttl-seconds: ${CONNECT_CENTER_MCP_TOKEN_TTL_SECONDS:300}
logging:
  level:
    org.springframework: INFO
    org.springframework.security: DEBUG
    org.springframework.websocket: INFO
    org.springframework.messaging: INFO
    org.springframework.ai.mcp: INFO
    io.modelcontextprotocol: INFO
    org.jooq: DEBUG
    org.oagi.score: DEBUG

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    export:
      enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: ${OTEL_SERVICE_NAMESPACE:oagi.score}
      deployment.environment.name: ${OTEL_DEPLOYMENT_ENVIRONMENT:unknown}
    tracing:
      sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
      export:
        schedule-delay: ${OTEL_BSP_SCHEDULE_DELAY:5s}
        timeout: ${OTEL_BSP_EXPORT_TIMEOUT:10s}
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          connect-timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:10s}
          timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:10s}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        step: ${OTEL_METRIC_EXPORT_INTERVAL:10s}
        connect-timeout: ${OTEL_EXPORTER_OTLP_METRICS_TIMEOUT:10s}
        read-timeout: ${OTEL_EXPORTER_OTLP_METRICS_TIMEOUT:10s}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}

  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          additional-path: server:/health

resource-server:
  jwk-set-uri: ${RS_JWK_SET_URI:}
  allowed-types: ${RS_ALLOWED_TYPES:JWT,at+jwt}

springdoc:
  swagger-ui:
    tags-sorter: alpha

score:
  security:
    secret-encryption:
      active-key-id: ${SCORE_APP_SECRET_ACTIVE_KEY_ID:primary}
      keys:
        primary: ${SCORE_APP_SECRET_KEY:}
  redis:
    # Destructive maintenance switch. Keep false for every multi-instance deployment.
    flush-on-startup: ${SCORE_REDIS_FLUSH_ON_STARTUP:false}
  integration:
    github:
      enabled: ${SCORE_GITHUB_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      scope: ${GITHUB_OAUTH_SCOPE:repo}
      authorization-uri: https://github.com/login/oauth/authorize
      token-uri: https://github.com/login/oauth/access_token
      api-base-url: https://api.github.com
      default-repo-url: ${SCORE_GITHUB_DEFAULT_REPO_URL:https://github.com/OAGi/oagis}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:4200/api/integration/github/callback}
      web-base-url: ${SCORE_WEB_BASE_URL:http://localhost:4200}
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
      # GitHub Projects v2 board fieldOption sync (issue #1533). When project-enabled is on, a component's
      # state change moves its linked issue into the matching fieldOption (or removes it) on the project board
      # at project-url, using the ACTING (connected) user's GitHub token — so the connect flow then also
      # requests the OAuth `project` (board write) and `read:org` (to verify org membership / warn when
      # the user can't write the board) scopes; users connected before must reconnect to grant them.
      # The board's owner/type/number are parsed from the URL.
      project-enabled: ${SCORE_GITHUB_PROJECT_ENABLED:false}
      project-url: ${SCORE_GITHUB_PROJECT_URL:https://github.com/orgs/OAGi/projects/8}
      # The board's single-select fieldOption field, BY NAME (the "Status" field). Change this to point fieldOption sync
      # at a differently-named field; if no field matches, sync falls back to discovering the field whose
      # options best cover the fieldOption names below.
      project-status-field-name: ${SCORE_GITHUB_PROJECT_STATUS_FIELD:Status}
      # The initial/reset fieldOption: a freshly LINKED issue (not yet on the board) is added here, and a
      # cancelled revision resets the card here. Set it to MATCH the board field's Default option — GitHub's
      # API does not expose that Default, so it cannot be read automatically. Leave BLANK to not place
      # linked issues in an initial fieldOption at all ("if there is no default, don't set it").
      project-default-field-option: ${SCORE_GITHUB_PROJECT_DEFAULT_FIELD_OPTION:New}
      # CcState -> board fieldOption name (keyed on the destination state of a transition). Keys must be
      # CcState values (anything else is ignored); blank fieldOptionByState are ignored, and each fieldOption name can be
      # overridden by its own environment variable. These names must match options of the fieldOption field
      # (project-status-field-name). A card is REMOVED from the board only on release (CcState.Published)
      # and on unlink — both fixed, not configured.
      project-field-option-by-state:
        WIP: ${SCORE_GITHUB_PROJECT_FIELD_OPTION_WIP:Implementing}
        Draft: ${SCORE_GITHUB_PROJECT_FIELD_OPTION_DRAFT:Implemented}
        Candidate: ${SCORE_GITHUB_PROJECT_FIELD_OPTION_CANDIDATE:Candidate}
        ReleaseDraft: ${SCORE_GITHUB_PROJECT_FIELD_OPTION_RELEASE_DRAFT:Ready for release}
  ai:
    catalog:
      bootstrap-enabled: ${SCORE_AI_CATALOG_BOOTSTRAP_ENABLED:false}
    observability:
      enabled: ${SCORE_AI_OBSERVABILITY_ENABLED:false}
      service-name: ${SCORE_AI_OBSERVABILITY_SERVICE_NAME:score-ai}
      webhook:
        enabled: ${SCORE_AI_OBSERVABILITY_WEBHOOK_ENABLED:false}
        endpoint: ${SCORE_AI_OBSERVABILITY_WEBHOOK_ENDPOINT:}
        secret: ${SCORE_AI_OBSERVABILITY_WEBHOOK_SECRET:}
        key-id: ${SCORE_AI_OBSERVABILITY_WEBHOOK_KEY_ID:default}
        allow-insecure-http: ${SCORE_AI_OBSERVABILITY_WEBHOOK_ALLOW_INSECURE_HTTP:false}
        allow-private-network: ${SCORE_AI_OBSERVABILITY_WEBHOOK_ALLOW_PRIVATE_NETWORK:false}
        queue-capacity: ${SCORE_AI_OBSERVABILITY_WEBHOOK_QUEUE_CAPACITY:1024}
        connect-timeout: ${SCORE_AI_OBSERVABILITY_WEBHOOK_CONNECT_TIMEOUT:2s}
        timeout: ${SCORE_AI_OBSERVABILITY_WEBHOOK_TIMEOUT:5s}
    multi-agent:
      # Caps apply per application instance; cluster-wide bounding comes from the
      # per-user active-request limit enforced by the shared AI request registry.
      max-concurrent-specialists: ${SCORE_AI_MULTI_AGENT_MAX_CONCURRENT_SPECIALISTS:16}
      max-concurrent-specialists-per-user: ${SCORE_AI_MULTI_AGENT_MAX_CONCURRENT_SPECIALISTS_PER_USER:8}
      specialist-inactivity-timeout: ${SCORE_AI_MULTI_AGENT_SPECIALIST_INACTIVITY_TIMEOUT:${SCORE_AI_MULTI_AGENT_SPECIALIST_TIMEOUT:2m}}
      maximum-workflow-iterations: ${SCORE_AI_MULTI_AGENT_MAXIMUM_WORKFLOW_ITERATIONS:3}
    quota:
      input-safety-percent: ${SCORE_AI_QUOTA_INPUT_SAFETY_PERCENT:10}
      reservation-timeout: ${SCORE_AI_QUOTA_RESERVATION_TIMEOUT:15m}
      reconciliation-batch-size: ${SCORE_AI_QUOTA_RECONCILIATION_BATCH_SIZE:200}
      reconciliation-interval: ${SCORE_AI_QUOTA_RECONCILIATION_INTERVAL:1m}
    policy:
      enabled: ${SCORE_AI_POLICY_ENABLED:true}
      quota-enforcement-enabled: ${SCORE_AI_QUOTA_ENFORCEMENT_ENABLED:false}
      usage-ledger-enabled: ${SCORE_AI_USAGE_LEDGER_ENABLED:true}
    providers:
      azure-foundry:
        type: anthropic
        base-url: ${AZURE_FOUNDRY_BASE_URL:${ANTHROPIC_FOUNDRY_BASE_URL:}}
        key: ${AZURE_FOUNDRY_API_KEY:${ANTHROPIC_FOUNDRY_API_KEY:}}
      azure-openai:
        type: openai
        base-url: ${AZURE_OPENAI_ENDPOINT:}
        key: ${AZURE_OPENAI_API_KEY:}
        api-version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
    model-name: claude-opus-5
    request-inactivity-timeout: ${SCORE_AI_REQUEST_INACTIVITY_TIMEOUT:${SCORE_AI_REQUEST_TIMEOUT:${score.ai.request-timeout:10m}}}
    elicitation-timeout: ${SCORE_AI_ELICITATION_TIMEOUT:${SCORE_AI_REQUEST_TIMEOUT:${score.ai.request-timeout:10m}}}
    change-approval-timeout: ${SCORE_AI_CHANGE_APPROVAL_TIMEOUT:${SCORE_AI_REQUEST_TIMEOUT:${score.ai.request-timeout:10m}}}
    assistant:
      # For Docker, mount a file and set this to e.g. file:/config/system-prompt-connect-center-assistant.md.
      system-prompt-resource: ${SCORE_AI_ASSISTANT_SYSTEM_PROMPT_RESOURCE:classpath:ai/system/system-prompt-connect-center-assistant.md}
    memory:
      max-messages: ${SCORE_AI_MEMORY_MAX_MESSAGES:40}
      retention: ${SCORE_AI_CONVERSATION_RETENTION:90d}
      cleanup-interval: ${SCORE_AI_CONVERSATION_CLEANUP_INTERVAL:24h}
    tools:
      tool-search:
        enabled: ${SCORE_AI_TOOL_SEARCH_ENABLED:true}
      files:
        enabled: ${SCORE_AI_FILES_ENABLED:true}
        retention: ${SCORE_AI_FILE_RETENTION:7d}
        max-bytes: ${SCORE_AI_FILE_MAX_BYTES:20MB}
        storage:
          provider: ${SCORE_AI_FILE_STORAGE_PROVIDER:local}
          local:
            root-directory: ${SCORE_AI_FILE_LOCAL_ROOT:./data/ai-files}
          s3:
            bucket: ${SCORE_AI_FILE_S3_BUCKET:}
            prefix: ${SCORE_AI_FILE_S3_PREFIX:ai-files}
            region: ${SCORE_AI_FILE_S3_REGION:us-east-1}
            endpoint: ${SCORE_AI_FILE_S3_ENDPOINT:}
            access-key: ${SCORE_AI_FILE_S3_ACCESS_KEY:}
            secret-key: ${SCORE_AI_FILE_S3_SECRET_KEY:}
            path-style-access: ${SCORE_AI_FILE_S3_PATH_STYLE:false}
          google-drive:
            access-token: ${SCORE_AI_FILE_GOOGLE_DRIVE_ACCESS_TOKEN:}
            folder-id: ${SCORE_AI_FILE_GOOGLE_DRIVE_FOLDER_ID:}
            api-base-url: ${SCORE_AI_FILE_GOOGLE_DRIVE_API_BASE_URL:https://www.googleapis.com}
        rendering:
          asset-base-uri: ${SCORE_AI_FILE_ASSET_BASE_URI:}
          font-files: ${SCORE_AI_FILE_FONT_FILES:}
          max-external-asset-bytes: ${SCORE_AI_FILE_MAX_EXTERNAL_ASSET_BYTES:5MB}
      connect-center-mcp:
        connection-name: connect-center-mcp
    middleware:
      # Profiles contain registered middleware bean IDs only. Required middleware
      # is added to every profile by the engine and cannot be disabled or shadowed.
      profiles:
        default: []
